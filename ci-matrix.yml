name: "Build and Deploy to VPS"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew bootJar -x test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.actor }}/my-app:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.actor }}/my-app:latest

  deploy-vps:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH (Serveo Port 32193)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: serveo.net
          port: 41516
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.actor }}/my-app:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d --name my-app -p 8080:8080 ghcr.io/${{ github.actor }}/my-app:latest
