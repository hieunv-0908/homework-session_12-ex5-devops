name: Fixed CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # FIX LỖI 1: Cấp quyền thực thi (+x) cho gradlew trước khi chạy build
      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      # Tiến hành build ứng dụng bằng Gradle
      - name: Build JAR with Gradle
        run: ./gradlew bootJar -x test

      # FIX LỖI 2: Xác thực Docker Registry với đúng biến Secret (secrets.GITHUB_TOKEN)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FIX LỖI 3: Chỉ định chính xác Build Context (.) và vị trí file Dockerfile (./Dockerfile)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/my-app:latest